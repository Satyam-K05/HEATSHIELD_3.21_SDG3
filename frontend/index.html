<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrbanAir Insight</title>

<link rel="stylesheet" href=""styles.css">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="dashboard-container">

<header class="header">
<div class="logo">
<div class="logo-icon">🌍</div>
<h1>UrbanAir <span class="highlight">Insight</span></h1>
</div>

<button id="refreshBtn" class="refresh-btn">REFRESH</button>
</header>

<!-- CITY SELECT -->
<div class="content-wrapper">

<aside class="sidebar">
<h3 class="section-title">SELECT CITY</h3>
<div class="city-list">

<div class="city-item" data-city="Delhi">Delhi</div>
<div class="city-item" data-city="Mumbai">Mumbai</div>
<div class="city-item" data-city="Bengaluru">Bengaluru</div>
<div class="city-item" data-city="Lucknow">Lucknow</div>
<div class="city-item" data-city="Indore">Indore</div>
<div class="city-item" data-city="Bhopal">Bhopal</div>
<div class="city-item" data-city="Pune">Pune</div>


</div>
</aside>

<!-- MAP -->
<main class="main-content">
<div class="map-container">
<h3 class="section-title">AIR QUALITY MAP</h3>
<img src="india-map-base.svg" class="india-map">
</div>
</main>

<!-- DETAILS -->
<aside class="details-panel">

<div class="details-header">
<h2 id="cityName">Delhi</h2>
<div id="cityAqiLarge" class="city-aqi-large">--</div>
</div>

<div class="weather-info">
<div>PM2.5 <span id="pm25">--</span></div>
<div>PM10 <span id="pm10Val">--</span></div>
<div>NO2 <span id="no2Val">--</span></div>
<div>SO2 <span id="so2Val">--</span></div>
<div>CO <span id="coVal">--</span></div>
</div>

</aside>
</div>

<!-- CHART -->
<div class="chart-card">
<h3>AQI TREND</h3>
<canvas id="aqiTrendChart"></canvas>
</div>

<footer class="footer">
<p>Live AQI powered by WAQI Backend</p>
</footer>

</div>

<script src="script.js"></script>
</body>
</html>
