<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AQI Dashboard</title>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <style>
    body { font-family: Arial; background: #f4f6f8; margin: 0; }
    header { background: #1e88e5; color: white; padding: 15px; text-align: center; }
    #main-content { padding: 20px; }
    .card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
    #aqi-map { height: 300px; border-radius: 8px; }
    .risk { font-weight: bold; padding: 6px 10px; border-radius: 5px; }
    .High { background: #e53935; color: white; }
    .Moderate { background: #fbc02d; }
    .Low { background: #43a047; color: white; }
    #loading-indicator { display: none; font-weight: bold; }
    #error-message { color: red; }
  </style>
</head>

<body>

<header>
  <h1>Air Quality & Health Risk Dashboard</h1>
</header>

<div id="main-content">

  <!-- Search -->
  <div class="card">
    <input id="city-search" type="text" placeholder="Enter city name" />
    <button id="search-button">Search</button>
  </div>

  <!-- Loading & Error -->
  <div id="loading-indicator">Loading data...</div>
  <div id="error-message"></div>

  <!-- City Info -->
  <div class="card">
    <h2 id="city-name">City</h2>
    <p>AQI: <span id="aqi-value">--</span></p>
    <span id="risk-level" class="risk">--</span>
    <p id="aqi-description"></p>
  </div>

  <!-- Pollution Values -->
  <div class="card">
    <p>PM2.5: <span id="pm25-value"></span></p>
    <p>PM10: <span id="pm10-value"></span></p>
    <p>NO₂: <span id="no2-value"></span></p>
    <p>SO₂: <span id="so2-value"></span></p>
    <p>CO: <span id="co-value"></span></p>
  </div>

  <!-- Chart -->
  <div class="card">
    <canvas id="pollution-chart"></canvas>
  </div>

  <!-- Map -->
  <div class="card">
    <div id="aqi-map"></div>
  </div>

</div>

<!-- Your JS file -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>
</html>
